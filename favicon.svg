<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- warm background -->
  <rect width="64" height="64" rx="10" fill="#f3ead7"/>

  <!-- sun -->
  <circle cx="32" cy="22" r="13" fill="#c96f45"/>

  <!-- hills -->
  <path d="M2 43 Q15 31 27 40 Q37 30 62 43 L62 64 L2 64 Z"
        fill="#7b8261"/>

  <!-- teepee canvas -->
  <path d="M16 57 L32 19 L48 57 Z"
