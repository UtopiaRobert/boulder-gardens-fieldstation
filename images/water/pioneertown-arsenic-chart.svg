<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-labelledby="t d">
<title id="t">Historic arsenic results in Pioneertown public groundwater</title>
<desc id="d">California drinking water maximum contaminant level is 10 micrograms per liter. A 2012 Pioneertown public water system violation recorded 111 micrograms per liter, and San Bernardino County reported 62 micrograms per liter in March 2017.</desc>
<defs>
<style>
.title{font:700 34px Georgia,serif;fill:#233018}.sub{font:18px Arial,sans-serif;fill:#5a624f}
.axis{font:17px Arial,sans-serif;fill:#5a624f}.value{font:700 28px Georgia,serif;fill:#2d3526}
.label{font:600 20px Georgia,serif;fill:#2d3526}.note{font:italic 17px Georgia,serif;fill:#6c614f}
</style>
</defs>
<rect width="980" height="610" rx="18" fill="#f7f1e2"/>
<text x="48" y="58" class="title">Historic arsenic results — Pioneertown public system</text>
<text x="48" y="90" class="sub">These are NOT measurements of the preserve outlet or the Boulder Gardens well.</text>
<!-- chart -->
<g transform="translate(105 140)">
  <line x1="0" y1="340" x2="775" y2="340" stroke="#756b57" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="340" stroke="#756b57" stroke-width="2"/>
  <g stroke="#cfc2a3" stroke-width="1">
    <line x1="0" y1="283.3" x2="775" y2="283.3"/><line x1="0" y1="226.7" x2="775" y2="226.7"/>
    <line x1="0" y1="170" x2="775" y2="170"/><line x1="0" y1="113.3" x2="775" y2="113.3"/>
    <line x1="0" y1="56.7" x2="775" y2="56.7"/><line x1="0" y1="0" x2="775" y2="0"/>
  </g>
  <g class="axis" text-anchor="end">
    <text x="-14" y="346">0</text><text x="-14" y="289">20</text><text x="-14" y="232">40</text>
    <text x="-14" y="176">60</text><text x="-14" y="119">80</text><text x="-14" y="63">100</text><text x="-14" y="7">120</text>
  </g>
  <text x="-70" y="190" class="axis" transform="rotate(-90 -70 190)">Arsenic (µg/L)</text>
  <!-- bars scaled 340/120 -->
  <rect x="65" y="311.7" width="150" height="28.3" rx="5" fill="#7c8572"/>
  <rect x="310" y="25.5" width="150" height="314.5" rx="5" fill="#9b6648"/>
  <rect x="555" y="164.3" width="150" height="175.7" rx="5" fill="#b08a4f"/>
  <g class="value" text-anchor="middle">
    <text x="140" y="296">10</text><text x="385" y="14">111</text><text x="630" y="151">62</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="140" y="375">CA drinking-water MCL</text>
    <text x="385" y="375">2012 violation result</text>
    <text x="630" y="375">March 2017 sample</text>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="140" y="402">10 µg/L</text><text x="385" y="402">11.1× the MCL</text><text x="630" y="402">6.2× the MCL</text>
  </g>
</g>
<text x="48" y="575" class="note">A nearby historic problem is a reason to test—not proof that every local well or spring contains the same arsenic level.</text>
</svg>